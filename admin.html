<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 페이지 - 프로젝트 구축 상세 질문지</title>
    <!-- Favicon -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 60vh;
        }
        .admin-login-panel {
            max-width: 400px;
            width: 100%;
            padding: 40px;
            text-align: center;
            background: #ffffff;
            border-radius: var(--radius-lg);
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }
        .admin-login-panel h2 {
            margin-bottom: 10px;
        }
        .admin-login-panel p {
            color: var(--text-muted);
            margin-bottom: 24px;
        }
    </style>
</head>
<body>
    <div class="background-animation">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main class="app-container">
        <header class="app-header">
            <div id="admin-logo" class="logo-container" title="Ucompanion Logo" style="cursor: pointer;">
                <img src="https://ucomp.co.kr/assets/images/main/logo_ucomp_03.svg" alt="Ucompanion Logo" class="logo">
            </div>
            <h1>관리자 대시보드</h1>
            <p class="subtitle">제출된 프로젝트 구축 질문지 데이터를 관리합니다.</p>
        </header>

        <div id="admin-login-container" class="admin-login-wrapper">
            <div class="admin-login-panel">
                <div class="admin-icon" style="font-size: 3rem; color: var(--primary); margin-bottom: 16px;"><i class="ph ph-lock-key"></i></div>
                <h2>관리자 인증</h2>
                <p>결과를 확인하려면 비밀번호를 입력하세요.</p>
                <div class="input-group" style="margin-bottom: 20px;">
                    <input type="password" id="admin-password" class="form-control" placeholder="비밀번호 (예: admin)" style="width: 100%; padding: 12px; border: 1px solid #dee2e6; border-radius: var(--radius-sm);">
                </div>
                <button id="btn-admin-login" class="btn btn-primary" style="width: 100%; padding: 12px;">로그인</button>
            </div>
        </div>

        <div id="app-content" style="display: none;">
            <!-- Dashboard content will be dynamically injected here -->
        </div>

        <!-- Custom Alert Modal -->
        <div id="alert-modal" class="modal-overlay hidden">
            <div class="modal-content" style="text-align: center; background: #ffffff; border-radius: var(--radius-lg); box-shadow: 0 10px 40px rgba(0,0,0,0.15); padding: 40px 30px; max-width: 380px;">
                <button class="modal-close"><i class="ph ph-x"></i></button>
                <div id="alert-icon" style="font-size: 4rem; color: var(--primary); margin-bottom: 16px;"><i class="ph-fill ph-info"></i></div>
                <h2 id="alert-title" style="margin-bottom: 8px;">알림</h2>
                <p id="alert-desc" style="color: var(--text-muted); margin-bottom: 24px; word-break: keep-all; line-height: 1.5;"></p>
                <div class="modal-actions" id="alert-modal-actions" style="display: flex; gap: 10px;">
                    <button id="btn-alert-cancel" class="btn btn-secondary w-full" style="display:none; background: #e0e0e0; color: #333; border: none;">취소</button>
                    <button id="btn-alert-ok" class="btn btn-primary w-full">확인</button>
                </div>
            </div>
        </div>

        <!-- HTML Mail Copy Modal -->
        <div id="html-mail-modal" class="modal-overlay hidden">
            <div class="modal-content glass-panel" style="text-align: left; max-width: 800px; width: 90%;">
                <button class="modal-close"><i class="ph ph-x"></i></button>
                <h2 style="margin-top: 0; margin-bottom: 8px;">결과 화면 및 HTML 소스</h2>
                <p style="color: var(--text-muted); margin-bottom: 20px; font-size: 0.9rem;">화면을 직접 드래그 복사(Cmd+C) 하거나 HTML 소스를 복사하여 메일에 붙여넣을 수 있습니다.</p>
                
                <div class="tabs" style="display: flex; gap: 10px; margin-bottom: 20px;">
                    <button class="btn btn-primary" id="tab-preview">화면 미리보기</button>
                    <button class="btn btn-secondary" id="tab-source" style="background: transparent; border: 1px solid var(--primary); color: var(--primary);">HTML 소스</button>
                </div>
                
                <div id="html-preview-area" style="width: 100%; height: 50vh; padding: 30px; border: 1px solid rgba(0,0,0,0.1); border-radius: var(--radius-sm); overflow-y: auto; background: #fff; margin-bottom: 20px;">
                    <!-- Preview will be rendered here -->
                </div>
                
                <textarea id="html-source-area" style="display: none; width: 100%; height: 50vh; padding: 12px; font-family: monospace; font-size: 0.85rem; border: 1px solid rgba(0,0,0,0.1); border-radius: var(--radius-sm); resize: vertical; margin-bottom: 20px; background: rgba(255,255,255,0.5);"></textarea>
                
                <button id="btn-copy-html" class="btn btn-primary w-full" style="display: none;"><i class="ph ph-copy"></i> HTML 복사하기</button>
            </div>
        </div>
    </main>

    <script src="config.js"></script>
    <script src="script.js"></script>
    <script src="script_admin.js"></script>
</body>
</html>
