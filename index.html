<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ucompanion 프로젝트 구축 상세 질문지</title>
    <meta name="description" content="유컴패니온 프로젝트 구축을 위한 상세 정보 수집 양식입니다.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-animation">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main class="app-container">
        <header class="app-header">
            <div class="logo-container" id="admin-trigger" title="관리자 모드 진입">
                <img src="https://ucomp.co.kr/assets/images/main/logo_ucomp_03.svg" alt="Ucompanion Logo" class="logo">
            </div>
            <h1>프로젝트 구축 상세 질문지</h1>
            <p class="subtitle">성공적인 프로젝트 구축을 위해 아래 질문에 답변해 주세요.</p>
        </header>

        <div id="app-content" class="glass-panel">
            <!-- Form content will be dynamically injected here -->
        </div>
        
        <!-- Modal for JSON result -->
        <div id="result-modal" class="modal-overlay hidden">
            <div class="modal-content glass-panel">
                <button class="modal-close"><i class="ph ph-x"></i></button>
                <h2>제출 완료</h2>
                <p>입력하신 데이터가 JSON 형태로 변환되었습니다.</p>
                <div class="code-block">
                    <pre><code id="json-result-output"></code></pre>
                </div>
                <div class="modal-actions">
                    <button id="btn-edit" class="btn btn-secondary"><i class="ph ph-pencil-simple"></i> 수정하기</button>
                    <button id="btn-download" class="btn btn-primary"><i class="ph ph-download-simple"></i> JSON 다운로드</button>
                </div>
            </div>
        </div>

        <!-- Admin Login Modal -->
        <div id="admin-login-modal" class="modal-overlay hidden">
            <div class="modal-content glass-panel admin-login-panel">
                <button class="modal-close"><i class="ph ph-x"></i></button>
                <div class="admin-icon"><i class="ph ph-lock-key"></i></div>
                <h2>관리자 인증</h2>
                <p>결과를 확인하려면 비밀번호를 입력하세요.</p>
                <div class="input-group">
                    <input type="password" id="admin-password" placeholder="비밀번호 (예: admin)">
                </div>
                <button id="btn-admin-login" class="btn btn-primary w-full">확인</button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
